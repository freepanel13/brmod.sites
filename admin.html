<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — UNIVERSE BRMOD PANEL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="nebula"></div>
    
    <div class="container">
        <h1 class="main-title">ADMIN — UNIVERSE BRMOD PANEL</h1>
        
        <div class="admin-panel">
            <h2>Bảng điều khiển quản trị</h2>
            <p class="note">Bạn không cần vượt link, nhấn nút để lấy khóa ngay</p>

            <div class="admin-gen">
                <label>Chọn loại MOD:</label>
                <select id="admin-mod-type">
                    <option value="BRMOD">BRMOD</option>
                    <option value="FFV7A">FF V7A</option>
                </select>
                
                <button class="gen-btn" onclick="adminGenerateKey()">Tạo & Lấy Khóa Ngay</button>
            </div>

            <div id="admin-key-result" class="hidden">
                <div class="key-box">
                    <p id="admin-key-display">---</p>
                    <span>Hạn sử dụng: 5 giờ kể từ lúc tạo</span>
                </div>
            </div>

            <button class="back-btn" onclick="logoutAdmin()">Đăng xuất</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
